<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficina Mecânica Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  /* HERO PREMIUM */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#050505,#000);
}

/* ferramentas */
.parallax{
  position:absolute;
  opacity:0.12;
  pointer-events:none;
}

.p1{top:10%; left:10%; width:70px;}
.p2{top:70%; left:20%; width:100px;}
.p3{top:40%; right:10%; width:80px;}
.p4{bottom:10%; right:30%; width:60px;}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:44px;
  letter-spacing:2px;
}

/* chave cromada */
.wrench{
  width:220px;
  margin-top:20px;
  filter:brightness(1.3);
  position:relative;
  animation:glow 4s infinite;
}

@keyframes glow{
  0%{filter:drop-shadow(0 0 5px #00d0ff);}
  50%{filter:drop-shadow(0 0 25px #00d0ff);}
  100%{filter:drop-shadow(0 0 5px #00d0ff);}
}
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#0b0b0b;
  color:white;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-size:42px;
  letter-spacing:2px;
}

.parallax-item{
  position:absolute;
  opacity:0.15;
}

.tool1{ top:10%; left:10%; width:80px; animation:float 6s infinite;}
.tool2{ bottom:15%; right:15%; width:100px; animation:float 8s infinite;}
.tool3{ top:50%; left:80%; width:60px; animation:float 7s infinite;}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}

/* Glow wrench */
.wrench{
  width:220px;
  margin-top:20px;
  filter:drop-shadow(0 0 8px #00d0ff);
  animation:shine 4s infinite;
}

@keyframes shine{
  0%{filter:drop-shadow(0 0 8px #00d0ff);}
  50%{filter:drop-shadow(0 0 20px #00d0ff);}
  100%{filter:drop-shadow(0 0 8px #00d0ff);}
}

/* SERVICES */
.services{
  padding:60px 20px;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  margin-top:40px;
}

.card{
  background:#161616;
  border-radius:15px;
  overflow:hidden;
  transition:0.4s;
  cursor:pointer;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  transition:0.4s;
}

.card:hover img{
  transform:scale(1.1);
}

.card:hover{
  transform:translateY(-8px);
}

.card h3{
  margin:15px 0;
}

/* WhatsApp Button */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px 18px;
  border-radius:50px;
  font-size:18px;
  text-decoration:none;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

/* MAP */
.map{
  margin-top:60px;
}

iframe{
  width:100%;
  height:350px;
  border:0;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<!-- ferramentas parallax -->
<img src="https://cdn-icons-png.flaticon.com/512/1146/1146869.png" class="parallax p1">
<img src="https://cdn-icons-png.flaticon.com/512/1146/1146869.png" class="parallax p2">
<img src="https://cdn-icons-png.flaticon.com/512/1146/1146869.png" class="parallax p3">
<img src="https://cdn-icons-png.flaticon.com/512/1146/1146869.png" class="parallax p4">

<div class="hero-content">
  <h1 id="typing"></h1>
  <img src="https://cdn-icons-png.flaticon.com/512/2966/2966481.png" class="wrench">
</div>

</section>

<!-- SERVICES -->
<section class="services">
<h2>Nossos Serviços</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1619642751034-765dfdf7c58e">
<h3>Suspensão</h3>
<p>Amortecedores, molas e estabilidade.</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
<h3>Freios</h3>
<p>Segurança total na frenagem.</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1487754180451-c456f719a1fc">
<h3>Motor</h3>
<p>Revisão completa e potência.</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537">
<h3>Troca de Óleo</h3>
<p>Proteção e durabilidade.</p>
</div>

</div>
</section>

<!-- MAP -->
<section class="map">
<h2 style="text-align:center">Nossa Localização</h2>

<iframe src="https://maps.google.com/maps?q=Comodoro%20MT&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</section>

<!-- WhatsApp -->
<a class="whatsapp" href="https://wa.me/556593396277?text=Olá,%20gostaria%20de%20agendar%20um%20serviço%20para%20meu%20carro." target="_blank">
💬 Agendar Serviço
</a>

<script>
// TEXTO DINÂMICO COM APAGAR
const words = ["Consertamos seu carro", "Cuidamos da sua segurança"];
let i = 0;
let timer;

function typingEffect() {
  let word = words[i].split("");
  var loopTyping = function() {
    if (word.length > 0) {
      document.getElementById('typing').innerHTML += word.shift();
    } else {
      deletingEffect();
      return false;
    };
    timer = setTimeout(loopTyping, 70);
  };
  loopTyping();
};

function deletingEffect() {
  let word = words[i].split("");
  var loopDeleting = function() {
    if (word.length > 0) {
      word.pop();
      document.getElementById('typing').innerHTML = word.join("");
    } else {
      if (words.length > (i + 1)) {
        i++;
      } else {
        i = 0;
      };
      typingEffect();
      return false;
    };
    timer = setTimeout(loopDeleting, 40);
  };
  timer = setTimeout(loopDeleting, 1500);
};

typingEffect();


// PARALLAX AO ROLAR
window.addEventListener("scroll", function(){
  const scrollY = window.scrollY;

  document.querySelectorAll(".parallax").forEach((el, index)=>{
    const speed = (index + 1) * 0.15;
    el.style.transform = `translateY(${scrollY * speed}px)`;
  });
});
</script>

</body>
</html>
